networks:
  traefik_network:
    external: true

services:
  navidrome:
    container_name: ${NAVIDROME_CONTAINER_NAME}
    image: deluan/navidrome:0.64.2
    restart: unless-stopped
    env_file:
      - navidrome.env
      - navidrome.secrets.env
    environment:
      - ND_DATAFOLDER=/config
      - ND_MUSICFOLDER=/media
    user: 1000:1000
    networks:
      - traefik_network
    expose:
      - 4533
    volumes:
      - ${NAVIDROME_CONFIG_PATH}:/config
      - ${NAVIDROME_MEDIA_PATH}:/media:ro
    labels:
      ## Traefik
      - traefik.enable=true
      # Router
      - traefik.http.routers.${NAVIDROME_CONTAINER_NAME}.entryPoints=websecure
      - traefik.http.routers.${NAVIDROME_CONTAINER_NAME}.rule=Host(`${NAVIDROME_FQDN}`)
      # Service
      - traefik.http.services.${NAVIDROME_CONTAINER_NAME}.loadbalancer.server.port=4533
      ## Dynacat
      - dynacat.name=Navidrome
      # https://github.com/Panonim/dynacat/blob/main/docs/docs/configuration.md#icons
      - dynacat.icon=sh:navidrome
      - dynacat.url=https://${NAVIDROME_FQDN}
      - dynacat.description=Music server and streamer that runs on all platforms.
      - dynacat.category=media
