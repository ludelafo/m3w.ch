services:
  resticprofile:
    container_name: ${RESTICPROFILE_CONTAINER_NAME}
    image: creativeprojects/resticprofile:0.34.0
    entrypoint: "/bin/ash"
    command:
      - "-c"
      - "resticprofile schedule --all && crond -f"
    restart: unless-stopped
    env_file:
      - resticprofile.${RESTICPROFILE_USER}.secrets.env
    volumes:
      - ./config/${RESTICPROFILE_USER}:/etc/resticprofile:ro
      - ${RESTICPROFILE_STORAGE_PATH}:/data/storage:ro
      - ${RESTICPROFILE_BACKUPS_PATH}:/data/backups
