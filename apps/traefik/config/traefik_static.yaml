global:
  sendAnonymousUsage: true

log:
  level: INFO

api:
  dashboard: true

ping: {}

providers:
  docker:
    exposedByDefault: false
    network: traefik_network
  file:
    filename: /etc/traefik/traefik_dynamic.yaml
    watch: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      middlewares:
        - http-strict-transport-security-header@file
      tls:
        certResolver: letsencrypt
        domains:
          - main: "m3w.ch"
            sans:
              - "*.m3w.ch"
              - "*.ludelafo.m3w.ch"
              - "*.heaspery.m3w.ch"

  minecraft:
    address: ":25565"

  # Internal entrypoint used by `ping` (the Docker health check calls
  # `traefik healthcheck --ping`, which checks `:8080/ping` by default). Traefik
  # creates it implicitly when `ping` is enabled: it is declared here to make it
  # visible. It is not published on the host and does not serve the dashboard
  # (`api.insecure` is not enabled).
  traefik:
    address: ":8080"

certificatesResolvers:
  letsencrypt:
    acme:
      email: notifications@m3w.ch
      storage: /var/lib/traefik/acme.json
      dnsChallenge:
        # https://doc.traefik.io/traefik/reference/install-configuration/tls/certificate-resolvers/acme/#dnschallenge
        provider: infomaniak
        propagation:
          delayBeforeChecks: 30s

## Plugins
# https://doc.traefik.io/traefik/reference/install-configuration/experimental/plugins/
experimental:
  plugins:
    # https://traefik-oidc-auth.sevensolutions.cc/
    traefik-oidc-auth:
      moduleName: "github.com/sevensolutions/traefik-oidc-auth"
      version: "v0.20.1"
