networks:
  traefik_network:
    external: true

services:
  minecraft-server:
    container_name: ${MINECRAFT_SERVER_CONTAINER_NAME}
    image: itzg/minecraft-server:2026.11.0-java25
    restart: unless-stopped
    env_file:
      - minecraft-server.env
    environment:
      - EULA=TRUE
    # Allow to run commands on the server with Docker `attach` command
    stdin_open: true
    tty: true
    networks:
      - traefik_network
    expose:
      - 25565
    volumes:
      - ${MINECRAFT_SERVER_DATA_PATH}:/data
    labels:
      ## Traefik
      - traefik.enable=true
      # Router
      - traefik.tcp.routers.${MINECRAFT_SERVER_CONTAINER_NAME}.entryPoints=minecraft
      - traefik.tcp.routers.${MINECRAFT_SERVER_CONTAINER_NAME}.rule=HostSNI(`*`)
      # Service
      - traefik.tcp.services.${MINECRAFT_SERVER_CONTAINER_NAME}.loadbalancer.server.port=25565
      ## Dynacat
      - dynacat.name=Minecraft server
      # https://github.com/Panonim/dynacat/blob/main/docs/docs/configuration.md#icons
      - dynacat.icon=sh:minecraft
      - dynacat.description=Minecraft server.
      - dynacat.category=games
