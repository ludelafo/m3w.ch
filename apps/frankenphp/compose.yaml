networks:
  traefik_network:
    external: true

services:
  frankenphp:
    container_name: ${FRANKENPHP_CONTAINER_NAME}
    image: dunglas/frankenphp:1.13.5-php8.5-alpine
    restart: unless-stopped
    env_file:
      - frankenphp.env
    environment:
      # Serve plain HTTP only, TLS is terminated by Traefik
      - SERVER_NAME=:80
    networks:
      - traefik_network
    expose:
      - 80
    volumes:
      - ${FRANKENPHP_PUBLIC_PATH}:/app/public:ro
    labels:
      ## Traefik
      - traefik.enable=true
      # Router
      - traefik.http.routers.${FRANKENPHP_CONTAINER_NAME}.entryPoints=websecure
      - traefik.http.routers.${FRANKENPHP_CONTAINER_NAME}.rule=Host(`${FRANKENPHP_FQDN}`)
      - traefik.http.routers.${FRANKENPHP_CONTAINER_NAME}.service=${FRANKENPHP_CONTAINER_NAME}
      # Router for the captive client: all its HTTP(S) requests are served
      # directly, whatever the domain (AdGuard Home resolves every domain to the
      # NAS for it). Its priority is just above the HTTP to HTTPS redirection
      # (priority 1), but below the `Host(...)` routers of the other services,
      # which stay reachable by the captive client
      - traefik.http.routers.${FRANKENPHP_CONTAINER_NAME}-captive.entryPoints=web,websecure
      - traefik.http.routers.${FRANKENPHP_CONTAINER_NAME}-captive.priority=2
      - traefik.http.routers.${FRANKENPHP_CONTAINER_NAME}-captive.rule=ClientIP(`${FRANKENPHP_CAPTIVE_CLIENT_IP}`)
      - traefik.http.routers.${FRANKENPHP_CONTAINER_NAME}-captive.service=${FRANKENPHP_CONTAINER_NAME}
      # Service
      - traefik.http.services.${FRANKENPHP_CONTAINER_NAME}.loadbalancer.server.port=80
      ## Dynacat
      - dynacat.name=FrankenPHP
      # https://github.com/Panonim/dynacat/blob/main/docs/docs/configuration.md#icons
      - dynacat.icon=si:php
      - dynacat.url=https://${FRANKENPHP_FQDN}
      - dynacat.description=Web server for static and PHP files.
      - dynacat.category=infrastructure
