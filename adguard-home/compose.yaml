name: AdGuard Home

services:
  adguard-home:
    container_name: ${ADGUARD_HOME_CONTAINER_NAME}
    hostname: ${ADGUARD_HOME_CONTAINER_NAME}
    image: adguard/adguardhome:v0.107.80
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config:/opt/adguardhome/conf
      - ./data:/opt/adguardhome/work/data
