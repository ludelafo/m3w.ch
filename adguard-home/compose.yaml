services:
  adguard-home:
    container_name: ${ADGUARD_HOME_CONTAINER_NAME}
    hostname: ${ADGUARD_HOME_CONTAINER_NAME}
    image: adguard/adguardhome:v0.107.80
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${ADGUARD_HOME_CONFIG_PATH:-./config}:/opt/adguardhome/conf
      - ${ADGUARD_HOME_DATA_PATH:-./data}:/opt/adguardhome/work/data
