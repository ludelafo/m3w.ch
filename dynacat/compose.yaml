services:
  dynacat:
    container_name: ${DYNACAT_CONTAINER_NAME}
    image: panonim/dynacat:3.0.2
    restart: unless-stopped
    env_file:
      - dynacat.env
    ports:
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${DYNACAT_CONFIG_PATH:-./config}:/app/config:ro
