networks:
  traefik_network:
    name: traefik_network

services:
  traefik:
    container_name: ${TRAEFIK_CONTAINER_NAME}
    hostname: ${TRAEFIK_CONTAINER_NAME}
    image: traefik:v3.7
    command:
      - --configFile=/etc/traefik/traefik_static.yaml
    restart: unless-stopped
    env_file:
      - traefik.secrets.env
    networks:
      - traefik_network
    ports:
      - 80:80
      - 443:443
      - 25565:25565
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${TRAEFIK_CONFIG_PATH}:/etc/traefik:ro
      - ${TRAEFIK_DATA_PATH}:/var/lib/traefik
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      start_period: 5s
      interval: 120s
    labels:
      ## Traefik
      - traefik.enable=true
      # Router
      - traefik.http.routers.${TRAEFIK_CONTAINER_NAME}.entryPoints=websecure
      - traefik.http.routers.${TRAEFIK_CONTAINER_NAME}.rule=Host(`${TRAEFIK_FQDN}`)
      # Service
      - traefik.http.routers.${TRAEFIK_CONTAINER_NAME}.service=api@internal
      ## Dynacat
      - dynacat.name=Traefik
      # https://github.com/Panonim/dynacat/blob/main/docs/docs/configuration.md#icons
      - dynacat.icon=sh:traefik
      - dynacat.url=https://${TRAEFIK_FQDN}
      - dynacat.description=Modern reverse proxy and load balancer.
      - dynacat.category=infrastructure
      ## Pocket ID
      - traefik.http.routers.${TRAEFIK_CONTAINER_NAME}.middlewares=oidc-auth@file
