chroma:
  auto: yes

clean:
  auto: no
  metaflac_command_path: metaflac
  arguments:
    - --remove
    - --dont-use-padding
    - --block-type=APPLICATION
    - --block-type=CUESHEET
    - --block-type=PADDING
    - --block-type=PICTURE
    - --block-type=SEEKTABLE
  tags_to_keep:
    - ACOUSTID_ID
    - ACOUSTID_FINGERPRINT
    - ALBUM
    - ALBUMARTIST
    - ARTIST
    - BPM
    - COMPOSER
    - DISCNUMBER
    - FLAC_ARGUMENTS
    - GENRE
    - INITIALKEY
    - LYRICS
    - METAFLAC_ARGUMENTS
    - MUSICBRAINZ_ALBUMARTISTID
    - MUSICBRAINZ_ALBUMID
    - MUSICBRAINZ_ARTISTID
    - MUSICBRAINZ_RELEASEGROUPID
    - MUSICBRAINZ_RELEASETRACKID
    - MUSICBRAINZ_TRACKID
    - MUSICBRAINZ_WORKID
    - PERFORMER
    - REPLAYGAIN_REFERENCE_LOUDNESS
    - REPLAYGAIN_ALBUM_GAIN
    - REPLAYGAIN_ALBUM_PEAK
    - REPLAYGAIN_TRACK_GAIN
    - REPLAYGAIN_TRACK_PEAK
    - TITLE
    - TOTALDISCS
    - TOTALTRACKS
    - TRACKNUMBER
    - YEAR
  # Opus comments are Vorbis comments, same flat key/value model as FLAC.
  opus_tags_to_keep:
    - ACOUSTID_ID
    - ACOUSTID_FINGERPRINT
    - ALBUM
    - ALBUMARTIST
    - ARTIST
    - BPM
    - COMPOSER
    - DISCNUMBER
    - GENRE
    - INITIALKEY
    - LYRICS
    - MUSICBRAINZ_ALBUMARTISTID
    - MUSICBRAINZ_ALBUMID
    - MUSICBRAINZ_ARTISTID
    - MUSICBRAINZ_RELEASEGROUPID
    - MUSICBRAINZ_RELEASETRACKID
    - MUSICBRAINZ_TRACKID
    - MUSICBRAINZ_WORKID
    - PERFORMER
    - TITLE
    - TOTALDISCS
    - TOTALTRACKS
    - TRACKNUMBER
    - YEAR
  # ID3v2 has no equivalent flat namespace: standard fields live in fixed
  # frames, everything else (MusicBrainz/AcoustID/ReplayGain) is a TXXX
  # frame keyed by its description.
  mp3_frames_to_keep:
    - COMM
    - TALB
    - TBPM
    - TCOM
    - TCON
    - TDRC
    - TIT2
    - TKEY
    - TPE1
    - TPE2
    - TPOS
    - TRCK
    - USLT
  mp3_txxx_to_keep:
    - ACOUSTID_FINGERPRINT
    - ACOUSTID_ID
    - MUSICBRAINZ_ALBUMARTISTID
    - MUSICBRAINZ_ALBUMID
    - MUSICBRAINZ_ARTISTID
    - MUSICBRAINZ_RELEASEGROUPID
    - MUSICBRAINZ_RELEASETRACKID
    - MUSICBRAINZ_TRACKID
    - MUSICBRAINZ_WORKID

convert:
  auto: no
  auto_keep: no
  format: opus
  dest: /data
  never_convert_lossy_files: yes
  embed: no
  copy_album_art: yes
  formats:
    mp3:
      command: /usr/local/bin/convert.sh mp3 "$source" "$dest"
      extension: mp3
    opus:
      command: /usr/local/bin/convert.sh opus "$source" "$dest"
      extension: opus
  paths:
    default:
      $custom_album_type/$custom_album_type/$custom_convert_format/%bucket{$albumartist,alpha}/$albumartist/$albumartist
      - $original_year - $album%if{$custom_reissue, [Reissue $year]}
      [$custom_convert_format $custom_convert_quality
      $custom_source]%if{$catalognum, {$catalognum$},%if{$barcode,
      {$barcode$}}}/%if{$custom_multidisc,$custom_discnumber-}$track. $title
    comp:
      $custom_album_type/$custom_album_type/$custom_convert_format/%bucket{$albumartist,alpha}/$album
      ($year) [$custom_convert_format $custom_convert_quality
      $custom_source]%if{$catalognum, {$catalognum$},%if{$barcode,
      {$barcode$}}}/%if{$custom_multidisc,$custom_discnumber-}$track. $title

cover:
  auto: no
  identify_command_path: identify
  convert_command_path: convert
  jpegoptim_command_path: jpegoptim
  width: 1200
  height: 1200
  arguments:
    - --strip-all

deezer:
  search_query_ascii: no
  search_limit: 5

disambiginalbum:
  auto: yes
  format: "({0})"
  ignore:
    - explicit

discogs:
  user_token: ${DISCOGS_USER_TOKEN}
  featured_string: "feat."

edit:
  itemfields: [track, title, artist, album]
  albumfields: [album, albumartist, label, catalognum]

encode:
  auto: yes
  flac_command_path: flac
  metaflac_command_path: metaflac
  arguments:
    - --compression-level-8
    - --exhaustive-model-search
    - --no-padding
    - --qlp-coeff-precision-search
    - --verify
    - --warnings-as-errors
  encode_if_flac_versions_mismatch: yes
  encode_if_encode_argument_tags_mismatch: yes
  save_encode_arguments_in_tag: yes
  save_encode_arguments_in_tag_name: FLAC_ARGUMENTS
  force: no

export:
  json:
    formatting:
      ensure_ascii: false
      indent: 2
      separators: [",", ": "]
      sort_keys: true
  csv:
    formatting:
      delimiter: ","
      dialect: excel

fetchart:
  auto: yes
  cover_names: [cover, front, art, album, folder]
  cautious: yes
  minwidth: 1200
  maxwidth: 1200
  enforce_ratio: yes
  cover_format: "jpg"
  quality: 100
  deinterlace: yes
  fanarttv_key: ${FANARTTV_API_KEY}
  google_key: ${GOOGLE_API_KEY}
  lastfm_key: ${LASTFM_API_KEY}
  store_source: yes
  sources:
    - filesystem
    - coverart
    - spotify
    - albumart
    - fanarttv
    - lastfm
    - itunes
    - amazon
    - wikipedia
    - google

filetote:
  extensions: .cue .log
  paths:
    ext:.cue: $albumpath/$artist - $album%if{$custom_multidisc, - CD $disc}
    ext:.log: $albumpath/$artist - $album%if{$custom_multidisc, - CD $disc}

ftintitle:
  auto: yes
  drop: no
  format: "(feat. {0})"

getlrc:
  auto: no
  overwrite: no
  fallback_to_plain: yes
  fallback_to_plain_lrc: yes

hook:
  hooks:
    - event: write
      command: echo 'Processing "{item.path}"...'

    - event: album_imported
      command: echo 'Album "{album.path}" imported.'

ihate:
  warn: ["albumtype:live"]
  skip: []

keyfinder:
  auto: yes
  overwrite: no
  bin: keyfinder-cli

lastgenre:
  auto: yes
  count: 1
  fallback: ""
  force: yes
  prefer_specific: yes
  source: album
  title_case: yes

listenbrainz:
  token: ${LISTENBRAINZ_TOKEN}
  username: ${LISTENBRAINZ_USERNAME}

lyrics:
  auto: yes
  fallback: ""
  force: no
  google_ap_key: ${GOOGLE_API_KEY}
  # Default: [lrclib, genius, lrcmux, google]
  sources: [lrclib]
  synced: yes

musicbrainz:
  host: musicbrainz.org

permissions:
  file: 664
  dir: 775

replaygain:
  auto: yes
  backend: metaflac
  overwrite: no

spotify:
  mode: list
  search_limit: 5

tags:
  auto: no
  metaflac_command_path: metaflac
  tags:
    METAFLAC_ARGUMENTS:
      --add-replay-gain --remove --dont-use-padding --block-type=APPLICATION
      --block-type=CUESHEET --block-type=PADDING --block-type=PICTURE
      --block-type=SEEKTABLE

tidal:
  client_id: mcjmpl1bPATJXcBT
  tokenfile: tidal_token.json
  search_limit: 5

titlecase:
  auto: yes
  fields:
    - album
    - albumartist
    - albumartist_credit
    - albumartist_sort
    - albumartists
    - albumartists_credit
    - albumartists_sort
    - artist
    - artist_credit
    - artist_sort
    - artists
    - artists_credit
    - artists_sort
    - title
  all_caps: yes
  all_lowercase: yes
  replace:
    - "’": "'"
    - "‘": "'"
    - "´": "'"
    - "“": '"'
    - "”": '"'
    - "‐": "-"
    - "–": "-"
    - "—": "-"
    # - "…": "..."
    # - "«": '"'
    # - "»": '"'
  preserve:
    - "(feat."
    - "DJ"
    - "EP"
    - "En"
    - "LP"
    - "MC"
    - "TV"
