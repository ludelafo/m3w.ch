default-internal-endpoint: &internal-defaults
  interval: 10m
  alerts:
    - type: telegram
  client:
    timeout: 10s
  group: Internal

endpoints:
  - name: AdGuard Home
    url: https://adguard.m3w.ch
    <<: *internal-defaults
    conditions:
      - "[STATUS] == 200"

  - name: Beszel
    url: https://beszel.m3w.ch
    <<: *internal-defaults
    conditions:
      - "[STATUS] == 200"

  - name: Dynacat
    url: https://m3w.ch
    <<: *internal-defaults
    conditions:
      - "[STATUS] == 200"

  - name: Navidrome
    url: https://navidrome.m3w.ch
    <<: *internal-defaults
    conditions:
      - "[STATUS] == 200"

  - name: Pocket ID
    url: https://auth.m3w.ch
    <<: *internal-defaults
    conditions:
      - "[STATUS] == 200"

  - name: qBittorrent
    url: https://qbittorrent.m3w.ch
    <<: *internal-defaults
    conditions:
      - "[STATUS] == 401"

  - name: Raspberry Pi
    url: icmp://192.168.1.254
    <<: *internal-defaults
    conditions:
      - "[CONNECTED] == true"

  - name: Syncthing (ludelafo)
    url: https://syncthing.ludelafo.m3w.ch
    <<: *internal-defaults
    conditions:
      - "[STATUS] == 401"

  - name: Tang
    url: http://192.168.1.254:8080/adv
    <<: *internal-defaults
    conditions:
      - "[STATUS] == 200"

  - name: Traefik
    url: https://traefik.m3w.ch
    <<: *internal-defaults
    conditions:
      - "[STATUS] == 401"

  - name: WireGuard Easy
    url: https://wireguard.m3w.ch
    <<: *internal-defaults
    conditions:
      - "[STATUS] == 200"

external-endpoints:
  # curl -I -X POST -H "Authorization: Bearer ${GATUS_RESTICPROFILE_TOKEN}" "https://gatus.m3w.ch/api/v1/endpoints/internal_resticprofile-(ludelafo)/external?success=true|false[]&error={error}"
  - name: resticprofile (ludelafo)
    group: Internal
    token: ${GATUS_RESTICPROFILE_TOKEN}
    heartbeat:
      # Automatically create a failure if no update is received within the time internal
      interval: 12h
    alerts:
      - type: telegram
        minimum-reminder-interval: 12h
