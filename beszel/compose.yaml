networks:
  traefik_network:
    external: true

services:
  beszel:
    container_name: ${BESZEL_CONTAINER_NAME}
    image: henrygd/beszel:0.21
    restart: unless-stopped
    env_file:
      - beszel.env
      - beszel.secrets.env
    environment:
      - APP_URL=https://${BESZEL_FQDN}
    networks:
      - traefik_network
    expose:
      - 8090
    volumes:
      - ${BESZEL_DATA_PATH}:/beszel_data
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      start_period: 5s
      interval: 120s # Then check every 120 seconds after that
    labels:
      ## Traefik
      - traefik.enable=true
      # Router
      - traefik.http.routers.${BESZEL_CONTAINER_NAME}.entryPoints=websecure
      - traefik.http.routers.${BESZEL_CONTAINER_NAME}.rule=Host(`${BESZEL_FQDN}`)
      # Service
      - traefik.http.services.${BESZEL_CONTAINER_NAME}.loadbalancer.server.port=8090
      ## Dynacat
      - dynacat.name=Beszel
      # https://github.com/Panonim/dynacat/blob/main/docs/docs/configuration.md#icons
      - dynacat.icon=sh:beszel
      - dynacat.url=https://${BESZEL_FQDN}
      - dynacat.description=Server monitoring tool.
      - dynacat.category=infrastructure

  beszel-agent:
    container_name: ${BESZEL_AGENT_CONTAINER_NAME}
    image: henrygd/beszel-agent:0.21-alpine
    restart: unless-stopped
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    env_file:
      - beszel_agent.env
      - beszel_agent.secrets.env
    environment:
      - BESZEL_AGENT_DISABLE_SSH=true
      - BESZEL_AGENT_HUB_URL=https://${BESZEL_FQDN}
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${BESZEL_AGENT_DATA_PATH}:/var/lib/beszel-agent
      - ${BESZEL_NVME0_PATH}:/extra-filesystems/nvme0:ro
      - ${BESZEL_SDA_PATH}:/extra-filesystems/sda:ro
      - ${BESZEL_SDB_PATH}:/extra-filesystems/sdb:ro
    healthcheck:
      test: ["CMD", "/agent", "health"]
      start_period: 5s
      interval: 120s
