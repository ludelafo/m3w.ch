# SOPS configuration
# https://getsops.io/docs/#using-sops-yaml-conf-to-select-kms-pgp-and-age-for-new-files
#
# Every `*.secrets.env` file is encrypted for all the age public keys listed
# below. See `apps/doco-cd/README.md` for the whole workflow.
creation_rules:
  - path_regex: \.secrets\.env$
    # Comma-separated list of age public keys allowed to decrypt the files
    age: >-
      age1fusytey4hz07jku67sl6gm8xjzy4slm6xkj0hwrrywztqdt77pgqq82dcn,
      age1mrfufyepamhgmj3c0l9dh7e5xt76rmhnygn8428v6z6a5lswedhq0l2h43
