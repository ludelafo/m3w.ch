# TRANSITION FILE - delete it once the NAS reads hosts/nas.m3w.ch/.doco-cd.yaml
#
# The Doco-CD instance of the NAS used to read this file. It now only contains
# the Doco-CD stack, so the old instance updates itself with
# `DEPLOY_CONFIG_BASE_DIR=/hosts/nas.m3w.ch` and reads
# `hosts/nas.m3w.ch/.doco-cd.yaml` from then on. The other stacks are not
# removed (this repository does not use auto-discovery).
#
# Keep the Doco-CD stack identical to the one of the NAS configuration file.

# Doco-CD
name: doco-cd
working_dir: apps/doco-cd
environment:
  DOCO_CD_CONTAINER_NAME: doco-cd
  # The directory of this file, relative to the root of the repository
  # https://doco.cd/latest/App-Settings/
  DOCO_CD_DEPLOY_CONFIG_BASE_DIR: /hosts/nas.m3w.ch
  # The repositories to poll for changes, in YAML format (interval in seconds)
  # https://doco.cd/latest/Poll-Settings/
  DOCO_CD_POLL_CONFIG: |
    - url: https://github.com/ludelafo/m3w.ch.git
      reference: main
      interval: 300
  DOCO_CD_DATA_PATH: /srv/storage/private/debian/apps/doco-cd/data
  DOCO_CD_SOPS_AGE_KEY_PATH: /srv/storage/private/debian/apps/doco-cd/secrets/sops_age_key.txt
timeout: 120
