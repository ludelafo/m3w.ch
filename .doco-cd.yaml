---
# Syncthing (ludelafo)
name: syncthing-ludelafo
working_dir: syncthing
compose_files:
  - compose.yaml
environment:
  SYNCTHING_FQDN: syncthing.ludelafo.m3w.ch
  SYNCTHING_CONTAINER_NAME: syncthing-ludelafo
  SYNCTHING_PORT: "22000"
  SYNCTHING_PUID: "1001"
  SYNCTHING_PGID: "100"
  SYNCTHING_CONFIG_PATH: /srv/storage/private/ludelafo/apps/syncthing/config
  SYNCTHING_DATA_PATH: /srv/storage/private/ludelafo
  OIDC_USER: ludelafo

