name: doco-cd
working_dir: doco-cd
compose_files:
  - compose.yaml
environment:
  DOCO_CD_DATA_PATH: /srv/storage/private/debian/apps/doco-cd/data
  DOCO_CD_SOPS_AGE_KEY_PATH: /srv/storage/private/debian/apps/doco-cd/secrets/sops_age_key.txt
timeout: 120

---
# AdGuard Home
name: adguard-home
working_dir: adguard-home
compose_files:
  - compose.yaml
environment:
  ADGUARD_HOME_CONFIG_PATH: /srv/storage/private/debian/apps/adguard-home/config
  ADGUARD_HOME_DATA_PATH: /srv/storage/private/debian/apps/adguard-home/data

---
# Beszel
name: beszel
working_dir: beszel
compose_files:
  - compose.yaml
environment:
  BESZEL_DATA_PATH: /srv/storage/private/debian/apps/beszel/beszel_data
  BESZEL_NVME0_PATH: /srv
  BESZEL_SDA_PATH: /srv/storage
  BESZEL_SDB_PATH: /srv/backups
  BESZEL_AGENT_DATA_PATH: /srv/storage/private/debian/apps/beszel/beszel_agent_data

---
# Dynacat
name: dynacat
