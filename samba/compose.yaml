services:
  samba:
    container_name: ${SAMBA_CONTAINER_NAME}
    hostname: ${SAMBA_CONTAINER_NAME}
    image: crazymax/samba:4.23.8
    restart: unless-stopped
    cap_add:
      - CAP_NET_ADMIN
      - CAP_NET_RAW
    env_file:
      - samba.env
      - samba.secrets.env
    environment:
      - CONFIG_FILE=/config/config.yaml
    network_mode: host
    volumes:
      - ${SAMBA_CACHE_PATH}:/data
      - ${SAMBA_CONFIG_PATH}:/config
      - ${SAMBA_PRIVATE_SHARE_PATH}:/shares/private
      - ${SAMBA_PUBLIC_SHARE_PATH}:/shares/public
    healthcheck:
      disable: true
    labels:
      ## Dynacat
      - dynacat.name=Samba
      # https://github.com/Panonim/dynacat/blob/main/docs/docs/configuration.md#icons
      - dynacat.icon=mdi:folder-network
      - dynacat.url=smb://${SAMBA_IP}
      - dynacat.description=Re-implementation of the SMB networking protocol.
      - dynacat.category=infrastructure
