name: resticprofile

services:
  resticprofile:
    container_name: ${RESTICPROFILE_CONTAINER_NAME}
    image: creativeprojects/resticprofile:0.33.1
    entrypoint: "/bin/ash"
    command:
      - "-c"
      - "resticprofile schedule --all && crond -f"
    restart: unless-stopped
    env_file:
      - resticprofile.env
    network_mode: none
    volumes:
      - ./config:/etc/resticprofile
      - ./data/storage:/data/storage
      - ./data/backups:/data/backups
