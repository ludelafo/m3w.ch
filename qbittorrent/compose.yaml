networks:
  traefik_network:
    external: true

services:
  qbittorrent:
    container_name: ${QBITTORRENT_CONTAINER_NAME}
    image: qbittorrentofficial/qbittorrent-nox:5.3.0-2
    restart: unless-stopped
    env_file:
      - qbittorrent.env
    environment:
      - QBT_LEGAL_NOTICE=confirm
    networks:
      - traefik_network
    expose:
      - 8080
    ports:
      - 52570:52570
      - 52570:52570/udp
    # https://github.com/qbittorrent/docker-qbittorrent-nox/discussions/90
    healthcheck:
      test:
        curl --fail --location --show-error --max-time 2 --output /dev/null --write-out "%{http_code}\n" --silent 127.0.0.1:8080/api/v2/app/version |
        grep -q 200 ||
        exit 1
      start_period: 30s
      start_interval: 5s
      interval: 5m
      timeout: 10s
      retries: 3
    volumes:
      - ${QBITTORRENT_CONFIG_PATH}:/config
      - ${QBITTORRENT_DOWNLOADS_PATH}:/downloads
    labels:
      ## Traefik
      - traefik.enable=true
      # Router
      - traefik.http.routers.${QBITTORRENT_CONTAINER_NAME}.entryPoints=websecure
      - traefik.http.routers.${QBITTORRENT_CONTAINER_NAME}.rule=Host(`${QBITTORRENT_FQDN}`)
      # Service
      - traefik.http.services.${QBITTORRENT_CONTAINER_NAME}.loadbalancer.server.port=8080
      ## Pocket ID
      - traefik.http.routers.${QBITTORRENT_CONTAINER_NAME}.middlewares=oidc-auth@file
      ## Dynacat
      - dynacat.name=qBittorrent
      # https://github.com/Panonim/dynacat/blob/main/docs/docs/configuration.md#icons
      - dynacat.icon=sh:qbittorrent
      - dynacat.url=https://${QBITTORRENT_FQDN}
      - dynacat.description=BitTorrent client.
      - dynacat.category=media
